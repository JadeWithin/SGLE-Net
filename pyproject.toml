[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rssgle"
version = "1.0.0"
description = "Rotation-Stabilized Spectrally Gated Log-Evidence Network for HSI classification"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Shao Yang"},
  {name = "Xuan Liu"},
  {name = "Wangyou Chen"},
  {name = "Shenming Qu"},
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["rssgle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py310"
